name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/ProductsApi.Tests/ProductsApi.Tests.csproj

      - name: Build
        run: dotnet build backend/ProductsApi.Tests/ProductsApi.Tests.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test backend/ProductsApi.Tests/ProductsApi.Tests.csproj --no-build -c Release --verbosity normal

      - name: Publish API
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet publish backend/api/products/ProductsApi.csproj -c Release -o backend/api/products/publish --runtime linux-x64 --self-contained false

      - name: Zip artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd backend/api/products/publish
          find . -type f | sort | zip -@ ../deploy.zip

      - name: Deploy to Azure App Service (OneDeploy)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USER }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASS }}
        run: |
          AUTH_HEADER=$(printf '%s:%s' "${KUDU_USER}" "${KUDU_PASS}" | base64 -w 0)
          curl -X POST \
            "https://amis4630-api.scm.azurewebsites.net/api/publish?type=zip&async=true" \
            --header "Authorization: Basic ${AUTH_HEADER}" \
            --header "Content-Type: application/zip" \
            --data-binary @backend/api/products/deploy.zip \
            --fail \
            --show-error
